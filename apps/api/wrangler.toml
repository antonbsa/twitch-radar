name = "twitch-radar-api"
main = "src/index.ts"
compatibility_date = "2026-06-22"

[vars]
ENVIRONMENT = "local"
PUBLIC_BASE_URL = "http://localhost:8788"
TWITCH_CLIENT_ID = ""
TWITCH_REDIRECT_URI = "http://localhost:8787/api/auth/twitch/callback"
EVENTSUB_CALLBACK_URL = "http://localhost:8787/api/webhooks/twitch/eventsub"
VAPID_PUBLIC_KEY = ""
VAPID_SUBJECT = "mailto:dev@example.com"

[[d1_databases]]
binding = "DB"
database_name = "twitch-radar-dev"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "../../infra/migrations"

[[kv_namespaces]]
binding = "APP_CACHE"
id = "00000000000000000000000000000001"
preview_id = "00000000000000000000000000000002"

[[queues.producers]]
binding = "TWITCH_EVENTS_QUEUE"
queue = "twitch-radar-twitch-events"

[[queues.producers]]
binding = "NOTIFICATION_JOBS_QUEUE"
queue = "twitch-radar-notification-jobs"

[[queues.consumers]]
queue = "twitch-radar-twitch-events"
max_batch_size = 10
max_batch_timeout = 5

[[queues.consumers]]
queue = "twitch-radar-notification-jobs"
max_batch_size = 10
max_batch_timeout = 5
