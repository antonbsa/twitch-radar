name: Code quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Deploy workflows call this so they gate on the same checks as PRs.
  workflow_call:

# A newer push to the same PR cancels the superseded run. Other events key on the sha so each
# commit's run (and a deploy's called run) finishes untouched (ADR 0061).
concurrency:
  group: code-quality-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  eslint:
    name: EsLint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run eslint
        run: npm run lint
      - name: Run prettier
        run: npm run prettier

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run typecheck
        run: npm run typecheck

  i18n-check:
    name: i18n Catalog Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run i18n catalog check
        run: npm run check-i18n

  db-check:
    name: D1 Migration Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run drizzle-kit check
        run: npm run db:check -w @twitch-radar/api
      - name: Run migration file check
        run: npm run check-migrations

  production-bundle-check:
    name: Production Bundle Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check production bundles exclude test-seam and sandbox code
        run: npm run check-production-bundle

  docs-check:
    name: Docs Link Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check relative links and anchors in docs
        run: npm run check-docs
