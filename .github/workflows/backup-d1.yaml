name: Back up D1 (production)

on:
  schedule:
    # Off-peak: the export locks the database while it runs (ADR 0063).
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Runs never overlap; a failed run is surfaced by GitHub's workflow-failure email.
concurrency:
  group: backup-d1
  cancel-in-progress: false

jobs:
  backup:
    name: Export, verify, encrypt and upload
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6dad0696ed2343ee7ebbc98e75f677fe
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Export production D1
        working-directory: apps/api
        run: npx wrangler d1 export twitch-radar-prod --remote --env production --output="$RUNNER_TEMP/dump.sql"
      # wrangler writes tables alphabetically, so a child table gets rows before its parent (users) exists and
      # the import fails with "no such table". Moving every INSERT after the schema makes the dump restorable as-is.
      - name: Put the schema before the data
        run: |
          awk '/^INSERT INTO/ { data = data $0 "\n"; next } { print } END { printf "%s", data }' "$RUNNER_TEMP/dump.sql" > "$RUNNER_TEMP/dump-ordered.sql"
          mv "$RUNNER_TEMP/dump-ordered.sql" "$RUNNER_TEMP/dump.sql"
      # A dump that doesn't import, or imports empty, is worse than none: fail before uploading it.
      - name: Verify the dump imports into a local D1
        working-directory: apps/api
        run: |
          npx wrangler d1 execute twitch-radar-prod --local --env production --persist-to "$RUNNER_TEMP/verify" --file="$RUNNER_TEMP/dump.sql"
          for table in users d1_migrations; do
            count=$(npx wrangler d1 execute twitch-radar-prod --local --env production --persist-to "$RUNNER_TEMP/verify" --json --command "SELECT COUNT(*) AS n FROM $table" | jq '.[0].results[0].n')
            echo "$table: $count rows"
            if [ "$count" -eq 0 ]; then
              echo "::error::$table is empty after importing the dump"
              exit 1
            fi
          done
      - name: Encrypt the dump
        run: age --encrypt --recipients-file infra/backups/age-recipient.txt --output "$RUNNER_TEMP/dump.sql.age" "$RUNNER_TEMP/dump.sql"
      # The key is scoped to the backup bucket; the 30-day lifecycle rule lives on the bucket (ADR 0063).
      - name: Upload to Backblaze B2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.B2_REGION }}
        run: |
          key="twitch-radar-prod-$(date -u +%Y-%m-%dT%H%M%SZ).sql.age"
          aws s3 cp "$RUNNER_TEMP/dump.sql.age" "s3://${{ vars.B2_BUCKET }}/$key" --endpoint-url "${{ vars.B2_ENDPOINT }}"
          echo "Uploaded \`$key\` ($(stat -c %s "$RUNNER_TEMP/dump.sql.age") bytes)" >> "$GITHUB_STEP_SUMMARY"
