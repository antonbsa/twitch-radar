name: Deploy Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Called workflows check out github.sha, which for a release event is the tagged commit.
  code-quality:
    uses: ./.github/workflows/code-quality.yaml

  tests:
    uses: ./.github/workflows/tests.yaml

  deploy:
    name: Deploy to Cloudflare (production)
    needs: [code-quality, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Fails if a required secret was never set via `wrangler secret put`.
      - name: Check production secrets
        run: npm run check-secrets:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6dad0696ed2343ee7ebbc98e75f677fe
      # Idempotent - only applies migrations not yet recorded against the
      # remote D1 database, so safe to run on every deploy.
      - name: Apply D1 migrations
        working-directory: apps/api
        run: npx wrangler d1 migrations apply twitch-radar-prod --remote --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6dad0696ed2343ee7ebbc98e75f677fe
      # Builds apps/web then runs `wrangler deploy --env production` from
      # apps/api (see the root "deploy" script) - the same command used for
      # local manual deploys.
      - name: Build and deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6dad0696ed2343ee7ebbc98e75f677fe
