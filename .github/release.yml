# Controls GitHub-generated release notes. Categories match top to bottom, so
# functional labels take precedence over `migration`/`config`, which describe
# risk rather than change type. Those labels remain required for PRs and are
# called out in release-note prose.
# See docs/decisions/0041-release-gated-production-deploys.md.
changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot
  categories:
    - title: Features
      labels:
        - enhancement
        - feature
    - title: Fixes
      labels:
        - bug
    - title: Docs & Decisions
      labels:
        - documentation
    # Catch-all for unlabeled PRs - without it they are dropped from the notes
    # entirely rather than listed uncategorized.
    - title: Other Changes
      labels:
        - "*"
